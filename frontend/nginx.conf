server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Docker's embedded DNS. Using a variable in proxy_pass makes nginx resolve
    # `backend` per request instead of once at startup, so nginx still starts
    # when the backend is down and follows it if its IP changes on restart.
    resolver 127.0.0.11 valid=10s;
    # A stopped backend has no DNS entry and no host to connect to. nginx's
    # defaults wait 30 s and 60 s for those, during which the page can only
    # show a spinner; with these the browser gets a 502 within seconds.
    resolver_timeout 5s;
    proxy_connect_timeout 5s;

    location /api/ {
        set $backend http://backend:8000;
        proxy_pass $backend;

        # $http_host keeps the port (localhost:8080); $host would drop it and
        # break absolute URLs the API builds, such as pagination links.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite puts a content hash in these filenames, so they can be cached forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Single-page app: unknown paths fall back to index.html, which must not be
    # cached or browsers would keep pointing at old asset hashes after a deploy.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
